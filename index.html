<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Experience &amp; Feedback</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="form-wrap">
    <img class="logo" src="logo.png" alt="Logo" width="80" height="80">
    <h1>Customer Experience &amp; Feedback</h1>

    <!--
      Set data-endpoint to your Google Apps Script web app URL
      (see google-apps-script/SETUP.md) to save responses to a Google Sheet.
      Leave it empty to only show the confirmation message.
    -->
    <form id="feedback-form" data-endpoint="" enctype="multipart/form-data" novalidate>

      <!-- 1. Personal Information -->
      <section>
        <h2>Personal Information</h2>

        <div class="field">
          <label for="name">Name <span class="req">*</span></label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="contact">Contact <span class="req">*</span></label>
          <input type="tel" id="contact" name="contact" autocomplete="tel"
                 inputmode="tel" pattern="^\+?[0-9\s\-]{10,15}$"
                 placeholder="e.g. +91 98765 43210" required>
        </div>
      </section>

      <!-- 2. Campus & Location -->
      <section>
        <h2>Campus &amp; Location</h2>

        <fieldset class="field">
          <legend>Select your Campus <span class="req">*</span></legend>
          <label class="choice"><input type="radio" name="campus" value="SNS" required> SNS</label>
          <label class="choice"><input type="radio" name="campus" value="TKH"> TKH</label>
        </fieldset>

        <div class="field conditional" data-show-when="campus=SNS" hidden>
          <label for="sns_location">Select Location <span class="req">*</span></label>
          <select id="sns_location" name="sns_location" required>
            <option value="" selected disabled>Select…</option>
            <option>SNS Gurgaon</option>
            <option>SNS Chennai</option>
            <option>SNS Noida</option>
            <option>SNS Faridabad</option>
            <option>SNS Pune</option>
            <option>SNS Bangalore</option>
          </select>
        </div>

        <div class="field conditional" data-show-when="campus=TKH" hidden>
          <label for="tkh_location">Select TKH Location <span class="req">*</span></label>
          <select id="tkh_location" name="tkh_location" required>
            <option value="" selected disabled>Select…</option>
            <option>Gurgaon</option>
            <option>Pune</option>
            <option>Bangalore</option>
          </select>
        </div>
      </section>

      <!-- 3. Feedback -->
      <section>
        <h2>What would you like to share?</h2>

        <fieldset class="field">
          <legend>What would you like to share? <span class="req">*</span></legend>
          <label class="choice"><input type="radio" name="share_type" value="Concern" required> Concern</label>
          <label class="choice"><input type="radio" name="share_type" value="Share your Experience"> Share your Experience</label>
          <label class="choice"><input type="radio" name="share_type" value="Concern about Services"> Concern about Services</label>
        </fieldset>

        <!-- Condition A: Concern -->
        <div class="conditional" data-show-when="share_type=Concern" hidden>
          <fieldset class="field">
            <legend>Product Select <span class="req">*</span></legend>
            <label class="choice"><input type="radio" name="product" value="Formal Trouser" required> Formal Trouser</label>
            <label class="choice"><input type="radio" name="product" value="Skirt"> Skirt</label>
            <label class="choice"><input type="radio" name="product" value="Half-Sleeves Formal Shirt"> Half-Sleeves Formal Shirt</label>
            <label class="choice"><input type="radio" name="product" value="Full-Sleeves Formal Shirt"> Full-Sleeves Formal Shirt</label>
            <label class="choice"><input type="radio" name="product" value="Track Pant"> Track Pant</label>
            <label class="choice"><input type="radio" name="product" value="Fleece Track Pant"> Fleece Track Pant</label>
            <label class="choice"><input type="radio" name="product" value="Track Shorts"> Track Shorts</label>
            <label class="choice"><input type="radio" name="product" value="Half-Sleeves House T-Shirt"> Half-Sleeves House T-Shirt</label>
            <label class="choice"><input type="radio" name="product" value="Full-Sleeves House T-Shirt"> Full-Sleeves House T-Shirt</label>
            <label class="choice"><input type="radio" name="product" value="Pullover"> Pullover</label>
            <label class="choice"><input type="radio" name="product" value="All Year Jacket"> All Year Jacket</label>
            <label class="choice"><input type="radio" name="product" value="Winter Smart Jacket"> Winter Smart Jacket</label>
            <label class="choice"><input type="radio" name="product" value="Thermal"> Thermal</label>
            <label class="choice"><input type="radio" name="product" value="Other"> Other</label>
            <div class="conditional nested" data-show-when="product=Other" hidden>
              <input type="text" id="product_other" name="product_other"
                     aria-label="Other product" placeholder="Please specify" required>
            </div>
          </fieldset>

          <div class="field">
            <label for="concern_image">Upload product image</label>
            <input type="file" id="concern_image" name="concern_image" accept="image/*" multiple>
            <div class="previews" data-for="concern_image"></div>
          </div>

          <div class="field">
            <label for="concern_feedback">Feedback <span class="req">*</span></label>
            <textarea id="concern_feedback" name="concern_feedback" rows="4"
                      placeholder="Describe your concern in detail" required></textarea>
          </div>
        </div>

        <!-- Condition B: Share your Experience -->
        <div class="conditional" data-show-when="share_type=Share your Experience" hidden>
          <div class="field">
            <label for="experience_feedback">Feedback <span class="req">*</span></label>
            <textarea id="experience_feedback" name="experience_feedback" rows="4"
                      placeholder="Tell us about your experience" required></textarea>
          </div>

          <div class="field">
            <label for="experience_image">Upload supporting images</label>
            <input type="file" id="experience_image" name="experience_image" accept="image/*" multiple>
            <div class="previews" data-for="experience_image"></div>
          </div>
        </div>

        <!-- Condition C: Concern about Services -->
        <div class="conditional" data-show-when="share_type=Concern about Services" hidden>
          <fieldset class="field">
            <legend>Concern Area <span class="req">*</span></legend>
            <label class="choice"><input type="radio" name="concern_area" value="Team Member" required> Team Member</label>
            <label class="choice"><input type="radio" name="concern_area" value="Other"> Other</label>
          </fieldset>

          <div class="field conditional" data-show-when="concern_area=*" hidden>
            <label for="service_remarks">Remarks <span class="req">*</span></label>
            <textarea id="service_remarks" name="service_remarks" rows="4"
                      placeholder="Share your feedback" required></textarea>
          </div>
        </div>
      </section>

      <p class="form-error" id="form-error" role="alert" hidden></p>
      <button type="submit" id="submit-btn">Submit</button>
    </form>

    <div class="thank-you" id="thank-you" hidden>
      <h2>Thank you!</h2>
      <p>Your feedback has been submitted.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
